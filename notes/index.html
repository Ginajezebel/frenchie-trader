<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Notes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Notes">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="icon-phoenix-180.png">
<link rel="icon" href="icon-phoenix-180.png">
<link rel="manifest" href="manifest.json">
<style>
/* One phone column, big text. Notes live only in this phone's storage; nothing is ever sent anywhere. */
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#141A33; --ink2:#5B6380; --muted:#7F87A3; --line:#E7EAF3; --chip:#EEF2FF;
  --blue:#3157F5; --blueInk:#FFFFFF; --red:#D92D45; --green:#00935F;
  --shadow:0 1px 2px rgba(20,30,80,.06),0 8px 24px rgba(20,30,80,.06);
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F22; --card:#141B36; --ink:#F2F4FF; --ink2:#B7BEDB; --muted:#8890B0; --line:#262F52; --chip:#1C2548;
  --blue:#7C97FF; --blueInk:#0A0F22; --red:#FF6B7F; --green:#35DE9C; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0F22; --card:#141B36; --ink:#F2F4FF; --ink2:#B7BEDB; --muted:#8890B0; --line:#262F52; --chip:#1C2548;
  --blue:#7C97FF; --blueInk:#0A0F22; --red:#FF6B7F; --green:#35DE9C; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 120px) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none!important}

/* top */
.top{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
.top h1{margin:0;font-family:var(--round);font-size:32px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);min-width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:700;font-size:18px;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}

/* search */
.search{position:relative;margin-bottom:18px}
.search input{width:100%;height:60px;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:0 52px 0 52px;font-size:20px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--blue)}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search svg{position:absolute;left:16px;top:18px;width:24px;height:24px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:var(--chip);border-radius:12px;font-size:22px;color:var(--ink2)}

/* section grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(20,26,51,.04),0 6px 18px rgba(20,26,51,.04);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:132px;color:var(--ink)}
.tile:active,.feature:active,.noteopen:active{transform:scale(.98)}
.tile .em{font-size:34px;line-height:1}
.tile b{font-size:20px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;display:block}
.tile .cnt{font-size:16px;color:var(--muted)}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.note{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,26,51,.04),0 6px 18px rgba(20,26,51,.04);border-radius:22px;overflow:hidden}
.noteopen{border:0;background:none;padding:16px 18px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.note b{font-size:16px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;overflow-wrap:anywhere}
.note p{margin:2px 0 0;color:var(--ink);font-size:23px;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.acts{display:flex;gap:10px;padding:0 18px 16px}
.act{flex:1;border:0;height:52px;border-radius:14px;background:var(--chip);color:var(--blue);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.act svg{width:22px;height:22px}
.note small{font-size:15px;color:var(--muted)}
mark{background:#FFE066;color:#111733;border-radius:4px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:19px}
.label{font-size:16px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}

/* big add button */
.fab{position:fixed;left:max(18px,calc(50% - 262px));right:max(18px,calc(50% - 262px));justify-content:center;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);border:0;background:var(--blue);color:var(--blueInk);font-size:21px;font-weight:800;height:62px;padding:0 24px;border-radius:20px;box-shadow:0 10px 30px rgba(47,91,255,.35);display:flex;align-items:center;gap:10px;z-index:20;white-space:nowrap}
.fab svg{width:26px;height:26px}

/* forms */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field > span{font-size:17px;font-weight:700;color:var(--ink2)}
.field input,.field textarea,.field select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;font-size:20px;outline:none;-webkit-appearance:none}
.field select{height:60px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 26px) 26px,calc(100% - 18px) 26px;background-size:8px 8px;background-repeat:no-repeat;padding-right:44px}
.field textarea{min-height:150px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.btn{border:0;width:100%;height:62px;border-radius:18px;font-size:21px;font-weight:800;background:var(--blue);color:var(--blueInk);margin-top:6px}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:2px solid var(--line)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.hint{font-size:16px;color:var(--muted);margin:6px 4px 0}
.meta{font-size:16px;color:var(--muted);margin:0 4px 14px}

/* settings */
.card{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:0 0 12px;color:var(--ink2);font-size:18px}
.secrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.secrow:first-of-type{border-top:0}
.secrow .em{font-size:28px;width:40px;text-align:center}
.emimg{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;display:inline-block}
.tile .emimg{width:44px;height:44px;margin:-5px 0}
.secrow b{flex:1;font-size:20px;font-weight:600;overflow-wrap:anywhere}
.small{border:0;background:var(--chip);border-radius:12px;height:44px;padding:0 14px;font-size:17px;font-weight:700}
.small.red{color:var(--red)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pick button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-size:18px;font-weight:600}

/* sheet (confirm) */
.veil{position:fixed;inset:0;background:rgba(5,8,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:24px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h3{margin:0 0 8px;font-size:24px}
.sheet p{margin:0 0 16px;color:var(--ink2);font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:700;font-size:18px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.sub{color:var(--muted);font-size:17px;margin:-6px 2px 16px;display:flex;align-items:center;gap:8px}
.sub .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sub .dot.ok{background:#1BA672} .sub .dot.bad{background:var(--red)}
.sub button{border:0;background:none;padding:0;font:inherit;color:inherit}
.feature{border:1px solid #F6DCC4;background:linear-gradient(135deg,#FFF7EE,#FFEFE2);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-bottom:12px;color:#141A33}
.feature .fimg{width:76px;height:76px;border-radius:20px;background:#fff;padding:6px;box-shadow:0 4px 14px rgba(200,90,20,.15);flex:none;object-fit:contain}
.feature .fimg.wide{width:124px;padding:0;object-fit:cover}
.subtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subtiles .tile .mascot{width:100%;aspect-ratio:1;object-fit:contain;border-radius:16px;background:#fff}
.subtiles .tile.pic{flex-direction:column;align-items:stretch;text-align:center;gap:10px;padding:12px 12px 16px}
.subtiles .tile.pic b{font-size:19px}
.subtiles .tile{flex-direction:row;align-items:center;min-height:0;padding:18px}
.subtiles .tile b{font-size:22px}
.subtiles .tile svg.chev{margin-left:auto;width:22px;height:22px;color:var(--muted);flex:none}
.note.write b{font-size:21px;color:var(--ink);text-transform:none;letter-spacing:0}
.note.write p{font-size:20px;font-weight:500;color:var(--ink2);white-space:pre-wrap;display:block;-webkit-line-clamp:unset}
.note.write .noteopen{padding-bottom:16px}
.feature b{font-size:24px;display:block;line-height:1.2} .feature span{color:#9A5B2B;font-size:17px}
.feature svg{margin-left:auto;width:22px;height:22px;color:#C08A5E;flex:none}
.badge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:26px}
.badge svg{width:26px;height:26px}
.badge .emimg{width:30px;height:30px;vertical-align:0}
.sync{border:0;background:var(--chip);color:var(--ink2);border-radius:999px;height:40px;padding:0 14px;font-size:16px;font-weight:700;white-space:nowrap}
.sync.ok{color:var(--green)} .sync.bad{color:var(--red)} .sync:empty{display:none}
.banner{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:17px;color:var(--ink2);margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto;flex:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
const STORE = "mynotes_v1";
const DEFAULT_SECTIONS = [
  ["car","🚗","Car"],["home","🏠","Home"],["health","🩺","Health"],["trading","📈","Trading"],
  ["money","💵","Money & Bills"],["family","👨‍👩‍👧","Family & Friends"],["pets","🐶","Pets"],
  ["work","💼","Work"],["travel","✈️","Travel"],["shopping","🛒","Shopping & Sizes"],
  ["ideas","💡","Ideas & To-do"],["other","📁","Other"]
];
const EMOJIS = ["phoenix","jaguar","📁","🚗","🏠","🩺","📈","💵","👨‍👩‍👧","🐶","💼","✈️","🛒","💡","🎓","⚽","🍳","🎁","🔧","📱","⛪","🌱"];

/* ---------- storage ---------- */
function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE)); if(d && Array.isArray(d.notes) && Array.isArray(d.sections)) return d; }catch{}
  return { sections: DEFAULT_SECTIONS.map(([id,em,name])=>({id,em,name})), notes: [], deleted: {}, sectionsUpdated: 0, lastBackup: 0 };
}
let db = load();
if(!db.deleted) db.deleted = {};
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(db)); syncSoon(); return true; }
  catch{ toast("Could not save. Phone storage may be full."); return false; }
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch{}

/* ---------- helpers ---------- */
const PHOENIX = "icon-phoenix-180.png";
const PICS = { phoenix: PHOENIX, jaguar: "icon-clever-180.png", sat: "sat-tile.jpg", homework: "homework-tile.jpg", "jag-calc": "jag-calc.png", "jag-pre": "jag-pre.png" };
const VIDS = { sat: "sat-tile.mp4", homework: "homework-tile.mp4" };
const WIDE = { homework: 1 };
const kids = id => db.sections.filter(s => s.parent === id);
const isWrite = id => (db.sections.find(s => s.id === id) || {}).kind === "write";
/* private pictures live in the private notes repo ("priv:<path>"), loaded with the key and kept on this device */
const privLoading = {};
function privSrc(em){
  if(!String(em||"").startsWith("priv:")) return "";
  const path = em.slice(5), k = "mynotes_pic:" + path;
  try{ const c = localStorage.getItem(k); if(c) return c; }catch{}
  if(getToken() && !privLoading[path]){
    privLoading[path] = 1;
    fetch(`https://api.github.com/repos/${DATA_REPO}/contents/${path.split("/").map(encodeURIComponent).join("/")}`, { cache:"no-store",
      headers:{ Authorization:`Bearer ${getToken()}`, Accept:"application/vnd.github.raw+json", "X-GitHub-Api-Version":"2022-11-28" } })
      .then(r => r.ok ? r.blob() : Promise.reject())
      .then(b => new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); }))
      .then(url => { try{ localStorage.setItem(k, url); }catch{} const v = location.hash.slice(1).split("/")[0]; if(v !== "edit" && v !== "new" && v !== "settings") render(); })
      .catch(() => { setTimeout(() => { delete privLoading[path]; }, 30000); });
  }
  return "";
}
function pic(em){ return PICS[em] || privSrc(em); }
function emHTML(em){ const p = pic(em); return p ? `<img class="emimg" src="${p}" alt="">` : String(em||"").startsWith("priv:") ? "✏️" : esc(em||""); }
function emText(em){ return em === "phoenix" ? "🔥" : em === "jaguar" ? "📖" : em === "sat" ? "🛡️" : em === "homework" ? "📚" : em === "jag-calc" ? "📐" : em === "jag-pre" || String(em).startsWith("priv:") ? "✏️" : (em||""); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sec = id => db.sections.find(s => s.id === id) || db.sections.find(s => s.id === "other") || db.sections[0];
const notesIn = id => db.notes.filter(n => n.section === id).sort((a,b)=>b.updated-a.updated);
function when(t){
  const d = new Date(t), now = new Date();
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString()))/864e5);
  if(days === 0) return "Today";
  if(days === 1) return "Yesterday";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear()===now.getFullYear()?undefined:"numeric"});
}
function hl(text, q){
  const t = esc(text); if(!q) return t;
  const re = new RegExp("(" + q.trim().split(/\s+/).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")","gi");
  return t.replace(re,"<mark>$1</mark>");
}
function snippet(body, q){
  const b = body.replace(/\s+/g," ").trim();
  if(!q) return b.slice(0,160);
  const i = b.toLowerCase().indexOf(q.trim().split(/\s+/)[0].toLowerCase());
  let start = Math.max(0, i - 40);
  if(start > 0){ const sp = b.indexOf(" ", start); if(sp > -1 && sp < i) start = sp + 1; }
  return (start>0?"… ":"") + b.slice(start, start+160);
}
let toastTimer;
function toast(msg){
  let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove("hide"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add("hide"), 2200);
}
function ask(title, text, yesLabel, onYes){
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="row"><button class="btn soft" data-no>Cancel</button><button class="btn" style="background:var(--red);color:#fff" data-yes>${esc(yesLabel)}</button></div></div>`;
  v.addEventListener("click", e => { if(e.target===v || e.target.closest("[data-no]")) v.remove(); if(e.target.closest("[data-yes]")){ v.remove(); onYes(); } });
  document.body.appendChild(v);
}
const ICON = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* section badges: line icon + soft color for the built-in sections, emoji for custom ones */
const SECICON = {
  car:['<path d="M5 16h14M6 16v2M18 16v2M4 16v-3l2-5a2 2 0 0 1 2-1h8a2 2 0 0 1 2 1l2 5v3"/><circle cx="8" cy="13" r=".8"/><circle cx="16" cy="13" r=".8"/>',"#E8F0FF","#3157F5"],
  home:['<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',"#E9F7EF","#1E9A5B"],
  health:['<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',"#FDECEF","#D6455D"],

function badge(s){
  const d = SECICON[s.id];
  if(d && s.em === (DEFAULT_SECTIONS.find(x=>x[0]===s.id)||[])[1]) return `<span class="badge" style="background:${d[1]};color:${d[2]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d[0]}</svg></span>`;

const items = c => c ? c + (c===1 ? " item" : " items") : "Empty";

/* ---------- routing (hash so the iPhone back swipe works) ---------- */
let query = "";
function go(h){ if(location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);

function render(){
  const h = location.hash.slice(1);
  const [view, arg] = h.split("/");
  window.scrollTo(0,0);
  if(view === "s" && arg) return viewSection(decodeURIComponent(arg));
  if(view === "edit") return viewEdit(arg ? decodeURIComponent(arg) : null);
  if(view === "new") return viewEdit(null, arg ? decodeURIComponent(arg) : null);
  if(view === "settings") return viewSettings();
  return viewHome();
}

function homeBody(){

function findUrl(t){
  const m = String(t||"").match(/\bhttps?:\/\/[^\s<>"]+|\bwww\.[^\s<>"]+|\b[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|org|net|edu|gov|io|co|us|app|me|info|biz|ly)(\/[^\s<>"]*)?/i);
  if(!m) return "";
  const u = m[0].replace(/[.,;:)\]]+$/,"");
  return /^https?:\/\//i.test(u) ? u : "https://" + u;
}

  const dirty = () => {

    else db.notes.push({id: uid(), title, body, section, created: Date.now(), updated: Date.now()});
    if(save()){ toast("Saved ✓"); history.replaceState(null,"","#s/"+encodeURIComponent(section)); render(); }
  });
  if(n) $("#f-del").addEventListener("click", () => ask("Delete this note?", "“"+(n.title||"Untitled")+"” will be gone for good.", "Delete", () => {
    db.notes = db.notes.filter(x=>x.id!==n.id); db.deleted[n.id] = Date.now(); save(); toast("Deleted"); history.replaceState(null,"",backTo); render();

}

async function exportBackup(){
  const stamp = new Date().toISOString().slice(0,10);
  const name = `my-notes-backup-${stamp}.json`;
  const data = JSON.stringify({app:"my-notes", version:1, saved:new Date().toISOString(), sections:db.sections, notes:db.notes}, null, 2);
  const file = new File([data], name, {type:"application/json"});
  const mark = () => { db.lastBackup = Date.now(); save(); viewSettings(); toast("Backup saved ✓"); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); mark(); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); mark();
}
function importBackup(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try{ d = JSON.parse(r.result); }catch{ toast("That file isn’t a notes backup."); return; }
    if(!d || !Array.isArray(d.notes) || !Array.isArray(d.sections)){ toast("That file isn’t a notes backup."); return; }
    ask("Restore this backup?", `It has ${d.notes.length} notes. Notes on this phone that aren’t in the file stay; matching notes are replaced.`, "Restore", () => {
      d.sections.forEach(s => { if(s && s.id && !db.sections.some(x=>x.id===s.id)) db.sections.splice(Math.max(0,db.sections.length-1),0,{id:String(s.id),em:String(s.em||"📁"),name:String(s.name||"Section"),...(s.parent?{parent:String(s.parent)}:{}),...(s.kind?{kind:String(s.kind)}:{})}); });
      d.notes.forEach(n => { if(!n || !n.id) return; const clean = {id:String(n.id), title:String(n.title||""), body:String(n.body||""), section:String(n.section||"other"), created:+n.created||Date.now(), updated:+n.updated||Date.now()};
        const i = db.notes.findIndex(x=>x.id===clean.id); i>=0 ? db.notes[i] = clean : db.notes.push(clean); });
      db.sectionsUpdated = Date.now(); save(); toast("Restored ✓"); go("#");
    });
  };
  r.readAsText(f);
}

/* ---------- GitHub sync (private repo; key stays on this device) ---------- */
const DATA_REPO = "Ginajezebel/my-notes";
const DATA_FILE = "notes.json";
const TOKEN_KEY = "mynotes_key";
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch{ return ""; } }
function setToken(v){ try{ v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); }catch{} }
let syncMsg = "", syncState = "", syncing = false, syncAgain = false, syncTimer;
function pillText(){ if(!getToken()) return ""; return syncState==="busy" ? "Syncing…" : syncState==="ok" ? "Synced" : syncState==="bad" ? "Not synced" : "Connecting…"; }
function setSync(state, msg){
  syncState = state; if(msg) syncMsg = msg;
  const p = $("#syncpill"); if(p) p.textContent = pillText() || "Saved on this device";
  const d = $("#syncdot"); if(d) d.className = "dot " + (state==="ok"?"ok":state==="bad"?"bad":"");
}
function syncSoon(){ if(!getToken()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 600); }
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function fromB64(b){ const bin = atob(b.replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
async function gh(method, body){
  const r = await fetch(`https://api.github.com/repos/${DATA_REPO}/contents/${DATA_FILE}`, {
    method, cache: "no-store",
    headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(body?{"Content-Type":"application/json"}:{}) },
    body: body ? JSON.stringify(body) : undefined
  });
  return r;
}
function payload(d){
  return JSON.stringify({ app:"my-notes", version:1, sections:d.sections, sectionsUpdated:d.sectionsUpdated||0, flags:d.flags||{},
    notes:[...d.notes].sort((a,b)=>a.id<b.id?-1:1), deleted:d.deleted||{} }, null, 1);
}
function merge(local, remote){
  if(!remote) return local;
  const deleted = {...(remote.deleted||{})};
  for(const [id,t] of Object.entries(local.deleted||{})) deleted[id] = Math.max(deleted[id]||0, t);
  const byId = new Map();
  for(const n of [...(remote.notes||[]), ...local.notes]){ const o = byId.get(n.id); if(!o || (n.updated||0) > (o.updated||0)) byId.set(n.id, n); }
  const notes = [...byId.values()].filter(n => !(deleted[n.id] >= (n.updated||0)));
  const useRemoteSecs = Array.isArray(remote.sections) && remote.sections.length && (remote.sectionsUpdated||0) > (local.sectionsUpdated||0);
  return { ...local, notes, deleted, flags: {...(remote.flags||{}), ...(local.flags||{})},
    sections: useRemoteSecs ? remote.sections : local.sections,
    sectionsUpdated: Math.max(local.sectionsUpdated||0, remote.sectionsUpdated||0) };
}
async function sync(loud){
  if(!getToken()) return false;
  if(syncing){ syncAgain = true; return false; }
  syncing = true; setSync("busy");
  let ok = false;
  try{
    for(let attempt=0; attempt<3; attempt++){
      const g = await gh("GET");
      let remote = null, sha;
      if(g.status === 401 || g.status === 403) throw new Error("key");
      if(g.status === 404){
        // 404 = file not made yet, or repo/key can't be seen. Check the repo itself.
        const rr = await fetch(`https://api.github.com/repos/${DATA_REPO}`, { cache:"no-store", headers:{ Authorization:`Bearer ${getToken()}`, Accept:"application/vnd.github+json" } });
        if(!rr.ok) throw new Error("repo");
      } else if(!g.ok) throw new Error("net");
      else { const j = await g.json(); sha = j.sha; try{ remote = JSON.parse(fromB64(j.content||"")); }catch{ remote = null; } }
      const merged = merge(db, remote);
      merged.lastBackup = db.lastBackup;
      db = merged;
      migrate();
      try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch{}
      const out = payload(db);
      if(remote && payload({sections:remote.sections||[],sectionsUpdated:remote.sectionsUpdated||0,flags:remote.flags||{},notes:remote.notes||[],deleted:remote.deleted||{}}) === out){ ok = true; break; }
      const p = await gh("PUT", { message: "Update notes", content: toB64(out), ...(sha?{sha}:{}) });
      if(p.ok){ ok = true; break; }
      if(p.status === 409 || p.status === 422) continue;   // changed elsewhere meanwhile: fetch again and merge
      if(p.status === 401 || p.status === 403) throw new Error("key-write");
      throw new Error("net");
    }
    if(!ok) throw new Error("net");
    const t = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    setSync("ok", "Synced at " + t);
    if(loud) toast("Synced ✓");
    const v = location.hash.slice(1).split("/")[0];
    if(v === "s"){ const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if(v === "" && $("#body")){ homeBody(); }
  }catch(e){
    const m = e.message === "key" ? "Key not accepted. Check it, or make a new one."
      : e.message === "key-write" ? "Key can read but not save. Give it Contents: Read and write."
      : e.message === "repo" ? `Can't find ${DATA_REPO}. Check the repo exists and the key has access.`
      : "No internet right now. Will try again.";
    setSync("bad", m);
    if(loud) toast(m);
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; syncSoon(); }
  }
  return ok;
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") syncSoon(); });
window.addEventListener("online", syncSoon);

/* ---------- taps ---------- */
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); } });

/* one-time additions: Huntington (phoenix) first, then Clever (reading jaguar) right under it.
   Flags are synced, so each is added once across devices and stays gone if removed. */
function migrate(){
  db.flags = db.flags || {};
  let changed = false;
  if(!db.flags.huntington){
    db.flags.huntington = 1; changed = true;
    if(!db.sections.some(s => s.id === "huntington")) db.sections.unshift({id:"huntington", em:"phoenix", name:"Huntington"});
  }
  if(!db.flags.clever){
    db.flags.clever = 1; changed = true;
    if(!db.sections.some(s => s.id === "clever")){
      const h = db.sections.findIndex(s => s.id === "huntington");
      db.sections.splice(h + 1, 0, {id:"clever", em:"jaguar", name:"Clever"});
    }
  }
  if(!db.flags.sat){
    db.flags.sat = 1; changed = true;
    if(!db.sections.some(s => s.id === "sat")){
      let i = db.sections.findIndex(s => s.id === "clever");
      if(i < 0) i = db.sections.findIndex(s => s.id === "huntington");
      db.sections.splice(i + 1, 0, {id:"sat", em:"sat", name:"SAT"});
    }
  }
  if(!db.flags.homework){
    db.flags.homework = 1; changed = true;
    if(!db.sections.some(s => s.id === "homework")){
      let i = ["sat","clever","huntington"].map(id => db.sections.findIndex(s => s.id === id)).find(x => x >= 0);
      if(i === undefined) i = -1;
      db.sections.splice(i + 1, 0,
        {id:"homework", em:"homework", name:"Homework"},
        {id:"hw-calc", em:"jag-calc", name:"North Creek Calculus", parent:"homework", kind:"write"},
        {id:"hw-precalc", em:"jag-pre", name:"North Creek Pre-Calculus", parent:"homework", kind:"write"});
    }
  }
  if(!db.flags.hwmascots){
    db.flags.hwmascots = 1; changed = true;
    const a = db.sections.find(s => s.id === "hw-calc"), b = db.sections.find(s => s.id === "hw-precalc");
    if(a){ a.em = "jag-calc"; if(a.name === "Northcreek Calculus") a.name = "North Creek Calculus"; }
    if(b){ b.em = "jag-pre"; if(b.name === "Pre Calculus") b.name = "North Creek Pre-Calculus"; }
  }
  if(!changed) return false;
  db.sectionsUpdated = Date.now();
  try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch{}
  return true;
}
if(!getToken()) migrate();
render();
syncSoon();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
